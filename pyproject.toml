[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-immune-system"
version = "0.2.0"
description = "SENTINEL: an authority-attenuating immune architecture for AI agents — detect and contain compromised agents without giving the defenders unrestricted authority"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "ai-agents",
    "agent-security",
    "capability-security",
    "authority-drift",
    "multi-agent-systems",
    "ai-safety",
    "access-control",
    "research-prototype",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jersonboydmilan/sentinel"
Documentation = "https://github.com/jersonboydmilan/sentinel/tree/main/docs"
Issues = "https://github.com/jersonboydmilan/sentinel/issues"

[project.scripts]
ais = "ais.__main__:main"

[tool.setuptools.packages.find]
include = ["ais*"]

[tool.setuptools.package-data]
ais = ["../policies/*.yaml"]

# The prototype has no runtime dependencies on purpose: the policy parser,
# hashing and test framework are part of the security boundary. These tool
# settings are for contributors who already have the tools installed.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]
